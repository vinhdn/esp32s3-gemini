; PlatformIO project cho board "Cheap Yellow Display" (CYD) ESP32-2432S028R
; (ESP32-WROOM-32 + ILI9341 2.8" 320x240 SPI + XPT2046 touch), thay thế board
; ESP32-S3 1.54" hien tai lam HUD lai xe. Xem README.md va include/board_pins.h
; truoc khi flash.

[env:cyd-esp32-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
extra_scripts = pre:pre_build_fixups.py

; Khong co PSRAM tren board nay (theo thong so nguoi dung cung cap: chi
; 520KB SRAM noi, flash 4MB/32Mbit) - KHONG bat -DBOARD_HAS_PSRAM.

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^9.2.2
    h2zero/NimBLE-Arduino @ ^1.4.1
    bblanchon/ArduinoJson @ ^7.2.1
    bodmer/TJpg_Decoder @ ^1.1.0

build_flags =
    ; --- lv_conf.h nam trong include/, TFT_eSPI doc cau hinh qua macro (khong
    ; sua file thu vien) ---
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DUSER_SETUP_LOADED=1

    ; --- Driver panel: CYD dung bien the ILI9341 can init sequence rieng.
    ; Neu mau bi am/lech sau khi flash, doi sang -DILI9341_DRIVER=1 ---
    -DILI9341_2_DRIVER=1

    ; Panel goc portrait 240x320 - xoay ngang (rotation) lam trong code
    ; (xem src/ui.cpp: tft.setRotation(1)).
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; --- Pin - PHAI khop include/board_pins.h, xem file do de doi khi can ---
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33

    ; 55MHz gay nhieu tin hieu that tren board nay (da xac nhan qua anh chup:
    ; mau bi lem/le sang mau khac khi BLE dang hoat dong dong thoi) - ha xuong
    ; muc an toan hon, van du muot cho UI tinh (khong scroll/animation nang).
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

    ; Font/glyph TFT_eSPI can cho text fallback (LVGL khong dung truc tiep,
    ; nhung TFT_eSPI yeu cau it nhat 1 font duoc bat de compile).
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
